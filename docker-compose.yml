services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL_CHEAP=${OPENAI_MODEL_CHEAP:-gpt-4o-mini}
      - OPENAI_MODEL_STRONG=${OPENAI_MODEL_STRONG:-gpt-4o}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL_CHEAP=${OLLAMA_MODEL_CHEAP:-qwen2.5:1.5b}
      - OLLAMA_MODEL_STRONG=${OLLAMA_MODEL_STRONG:-qwen2.5:3b}
      - CORS_ORIGINS=http://localhost:5173
    volumes:
      # Backend resolves data/docs paths as ../data, ../docs relative to the
      # backend/ folder (see app/core/config.py) — with WORKDIR=/app inside
      # the container, that resolves to /data and /docs at container root.
      - ./data:/data
      - ./docs:/docs
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

# One command to run both sides: `docker compose up --build`
# Backend reads data/raw and docs/kpi_contract.yaml from the repo root via
# the mounted volumes above, so no data needs to be baked into the image.
